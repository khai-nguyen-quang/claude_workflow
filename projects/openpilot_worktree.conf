# Gitignored assets carried into a new openpilot ticket worktree.
#
# One repo-relative path per line; `#` starts a comment. Paths are hard-linked
# (cp -al) from $WORKSPACE_ROOT/openpilot, so this costs no meaningful time or
# disk. Only list gitignored artifacts that are expensive to regenerate and are
# read-only in practice -- never build outputs (build/ is per-worktree by
# design, and sharing it would defeat the isolation).

# DMS + ADAS model blobs (~216 MB). Without these every worktree would need a
# separate `./dev.sh fetch-models` download.
system/dms/modules/models
selfdrive/modeld/models

# Vendored rednose checkout: untracked in the main repo, required by the build.
rednose_repo
