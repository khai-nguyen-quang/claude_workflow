# Gitignored assets carried into a new <project> ticket worktree.
#
# Copy this file to projects/<project>_worktree.conf and list the repo-relative
# paths a fresh worktree needs but git will not provide -- downloaded model
# files, vendored checkouts, large fixtures. One path per line; `#` starts a
# comment. Paths are hard-linked (cp -al) from the main checkout, falling back
# to a copy across filesystems.
#
# Do NOT list build output directories: each worktree must build its own, or the
# parallel sessions will corrupt each other's artifacts.
#
# The file is optional -- with no conf, a worktree is created with submodules
# initialised and nothing else carried over.

# path/to/models
# path/to/vendored_checkout
